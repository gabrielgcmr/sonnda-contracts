# sonnda-contracts/openapi.yaml
# NOTE: source entrypoint. Bundled, embedded and served at /openapi.yaml.
openapi: 3.0.3
info:
  title: Sonnda API
  version: "0.1.0"
  description: |-
    OpenAPI inicial das rotas HTTP da Sonnda.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
  - url: https://api.sonnda.com.br
    description: Produção
security:
  - bearerAuth: []
paths:
  # Public
  /:
    get:
      operationId: getApiMetadata
      summary: API metadata
      security: []
      tags: [Public]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      tags: [Public]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness check
      security: []
      tags: [Public]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /docs:
    get:
      operationId: getApiDocs
      summary: API docs (Redoc)
      security: []
      tags: [Public]
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
  # Me (usuário autenticado)
  /v1/me:
    $ref: "./openapi/paths/account.yaml#/me"
  /v1/me/patients:
    $ref: "./openapi/paths/patient-access.yaml#/current-account-patients"
  # patients
  /v1/patients:
    $ref: "./openapi/paths/patient.yaml#/collection"
  /v1/patients/{patientId}:
    $ref: "./openapi/paths/patient.yaml#/item"
  /v1/patients/{patientId}/exam-documents:
    $ref: "./openapi/paths/exams.yaml#/collection"
  /v1/exam-documents/{documentId}:
    $ref: "./openapi/paths/exams.yaml#/item"
  /v1/patients/{patientId}/labs:
    $ref: "./openapi/paths/labs.yaml#/legacy-list"
  /v1/patients/{patientId}/lab-reports:
    $ref: "./openapi/paths/labs.yaml#/collection"
  /v1/lab-reports/{labReportId}:
    $ref: "./openapi/paths/labs.yaml#/item"
# =========================
# Components
# =========================
components:
  # Security Schemes
  securitySchemes:
    bearerAuth:
      $ref: "./openapi/components/security-schemes.yaml#/bearerAuth"
  # Parameters
  parameters:
    PatientId:
      $ref: "./openapi/components/parameters.yaml#/PatientId"
    LimitParam:
      $ref: "./openapi/components/parameters.yaml#/LimitParam"
    OffsetParam:
      $ref: "./openapi/components/parameters.yaml#/OffsetParam"
  # Responses
  responses:
    Problem:
      $ref: "./openapi/components/responses.yaml#/Problem"
  schemas:
    ProblemDetails:
      $ref: "./openapi/components/schemas/common.yaml#/ProblemDetails"
    HealthResponse:
      $ref: "./openapi/components/schemas/common.yaml#/HealthResponse"
    RootResponse:
      $ref: "./openapi/components/schemas/common.yaml#/RootResponse"
    CreateUserRequest:
      $ref: "./openapi/components/schemas/account.yaml#/CreateUserRequest"
    UpdateUserRequest:
      $ref: "./openapi/components/schemas/account.yaml#/UpdateUserRequest"
    CreatePatientRequest:
      $ref: "./openapi/components/schemas/patient.yaml#/CreatePatientRequest"
    PatientCreatedResponse:
      $ref: "./openapi/components/schemas/patient.yaml#/PatientCreatedResponse"
    User:
      $ref: "./openapi/components/schemas/account.yaml#/User"
    AccessiblePatientSummary:
      $ref: "./openapi/components/schemas/patient-access.yaml#/AccessiblePatientSummary"
    AccessiblePatientsResponse:
      $ref: "./openapi/components/schemas/patient-access.yaml#/AccessiblePatientsResponse"
    RelationshipType:
      $ref: "./openapi/components/schemas/patient-access.yaml#/RelationshipType"
    Patient:
      $ref: "./openapi/components/schemas/patient.yaml#/Patient"
    PatientsList:
      $ref: "./openapi/components/schemas/patient.yaml#/PatientsList"
    ExamDocument:
      $ref: "./openapi/components/schemas/exams.yaml#/ExamDocument"
    LabsList:
      $ref: "./openapi/components/schemas/exams.yaml#/LabsList"
    LabReportSummaryList:
      $ref: "./openapi/components/schemas/exams.yaml#/LabReportSummaryList"
    LabReportSummary:
      $ref: "./openapi/components/schemas/exams.yaml#/LabReportSummary"
    LabResultSummary:
      $ref: "./openapi/components/schemas/exams.yaml#/LabResultSummary"
    LabResultItemSummary:
      $ref: "./openapi/components/schemas/exams.yaml#/LabResultItemSummary"
    LabReportFullList:
      $ref: "./openapi/components/schemas/exams.yaml#/LabReportFullList"
    LabReportFull:
      $ref: "./openapi/components/schemas/exams.yaml#/LabReportFull"
    LabTestResultFull:
      $ref: "./openapi/components/schemas/exams.yaml#/LabTestResultFull"
    LabTestItemFull:
      $ref: "./openapi/components/schemas/exams.yaml#/LabTestItemFull"
