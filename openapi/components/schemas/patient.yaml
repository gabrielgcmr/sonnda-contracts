# sonnda-contracts/openapi/components/schemas/patient.yaml
CreatePatientRequest:
  type: object
  required:
    - cpf
    - full_name
    - birth_date
    - gender
    - race
    - relation_type
  properties:
    cpf:
      type: string
      pattern: "^[0-9]{11}$"
      minLength: 11
      maxLength: 11
      description: "CPF sem pontuação (apenas dígitos)"
    cns:
      type: string
      nullable: true
    full_name:
      type: string
      minLength: 1
    birth_date:
      type: string
      format: date
    gender:
      type: string
      enum: [MALE, FEMALE, OTHER, UNKNOWN]
    race:
      type: string
      enum: [WHITE, BLACK, ASIAN, MIXED, INDIGENOUS, UNKNOWN]
    phone:
      type: string
      pattern: "^\\+?[0-9]{10,15}$"
      minLength: 10
      maxLength: 16
      nullable: true
    avatar_url:
      type: string
      format: uri
      nullable: true
    relation_type:
      $ref: "./patient-access.yaml#/RelationshipType"
PatientCreatedResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
  required: [id]
Patient:
  type: object
  description: Representação do paciente retornada pela API.
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    owner_user_id:
      type: string
      format: uuid
    cpf:
      type: string
      pattern: "^[0-9]{11}$"
      minLength: 11
      maxLength: 11
    cns:
      type: string
    full_name:
      type: string
      minLength: 1
    birth_date:
      type: string
      format: date-time
    gender:
      type: string
      enum: [MALE, FEMALE, OTHER, UNKNOWN]
    race:
      type: string
      enum: [WHITE, BLACK, ASIAN, MIXED, INDIGENOUS, UNKNOWN]
    phone:
      type: string
      pattern: "^\\+?[0-9]{10,15}$"
    avatar_url:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    [
      id,
      cpf,
      full_name,
      birth_date,
      gender,
      race,
      avatar_url,
      created_at,
      updated_at,
    ]
PatientsList:
  type: array
  items:
    $ref: "#/Patient"
