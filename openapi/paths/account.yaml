# sonnda-contracts/openapi/paths/account.yaml
me:
  post:
    operationId: createCurrentAccount
    summary: Criar usuário
    description: |-
      Cria o usuário da plataforma a partir da identidade autenticada (JWT do Supabase).
      Requer token válido do Supabase (Bearer).
      O servidor define account_type como basic_care.
    tags: [Me]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/account.yaml#/CreateUserRequest"
    responses:
      "201":
        description: Usuário criado
        content:
          application/json:
            schema:
              $ref: "../components/schemas/account.yaml#/User"
      "409":
        $ref: "../components/responses.yaml#/Problem"
      "400":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "422":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
  get:
    operationId: getCurrentAccount
    summary: Obter perfil do usuário atual
    description: Retorna 403 com code PROFILE_NOT_FOUND quando a identidade está autenticada mas não possui cadastro local.
    tags: [Me]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/account.yaml#/User"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
  put:
    operationId: updateCurrentAccount
    summary: Atualizar perfil do usuário atual
    tags: [Me]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/account.yaml#/UpdateUserRequest"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/account.yaml#/User"
      "400":
        $ref: "../components/responses.yaml#/Problem"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "422":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
  delete:
    operationId: deleteCurrentAccount
    summary: Remover usuário atual (hard delete)
    tags: [Me]
    responses:
      "204":
        description: No Content
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
