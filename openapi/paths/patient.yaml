# sonnda-contracts/openapi/paths/patient.yaml
collection:
  post:
    operationId: createPatient
    summary: Criar paciente
    tags: [Patient]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/patient.yaml#/CreatePatientRequest"
    responses:
      "201":
        description: Paciente criado
        headers:
          Location:
            description: Caminho do novo recurso
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../components/schemas/patient.yaml#/PatientCreatedResponse"
      "400":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "422":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
  get:
    operationId: listPatients
    summary: Listar pacientes
    tags: [Patient]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/patient.yaml#/PatientsList"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
item:
  get:
    operationId: getPatient
    summary: Obter paciente
    tags: [Patient]
    parameters:
      - $ref: "../components/parameters.yaml#/PatientId"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/patient.yaml#/Patient"
      "400":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "404":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
