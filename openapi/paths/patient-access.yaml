# sonnda-contracts/openapi/paths/patient-access.yaml
current-account-patients:
  get:
    operationId: listAccessiblePatients
    summary: Listar pacientes acessíveis pela conta atual
    tags: [Patient Access]
    parameters:
      - $ref: "../components/parameters.yaml#/LimitParam"
      - $ref: "../components/parameters.yaml#/OffsetParam"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/patient-access.yaml#/AccessiblePatientsResponse"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
