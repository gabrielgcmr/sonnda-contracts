# sonnda-contracts/openapi/paths/exams.yaml
collection:
  get:
    operationId: listExamDocuments
    summary: Listar documentos de exame
    tags: [ExamDocuments]
    parameters:
      - $ref: "../components/parameters.yaml#/PatientId"
      - $ref: "../components/parameters.yaml#/LimitParam"
      - $ref: "../components/parameters.yaml#/OffsetParam"
    responses:
      "200":
        description: Documentos de exame do paciente
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/exams.yaml#/ExamDocument"
      "400":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
  post:
    operationId: uploadExamDocument
    summary: Enviar documento de exame
    tags: [ExamDocuments]
    parameters:
      - $ref: "../components/parameters.yaml#/PatientId"
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              collection_date:
                type: string
                format: date
    responses:
      "201":
        description: Documento recebido e classificado
        content:
          application/json:
            schema:
              $ref: "../components/schemas/exams.yaml#/ExamDocument"
      "400":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "413":
        $ref: "../components/responses.yaml#/Problem"
      "415":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"

item:
  get:
    operationId: getExamDocument
    summary: Obter documento de exame
    tags: [ExamDocuments]
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Documento de exame
        content:
          application/json:
            schema:
              $ref: "../components/schemas/exams.yaml#/ExamDocument"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "404":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
file:
  get:
    operationId: getExamDocumentFile
    summary: Obter URL temporária do arquivo de exame
    tags: [ExamDocuments]
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: URL temporária e autorizada para visualizar ou baixar o arquivo
        content:
          application/json:
            schema:
              $ref: "../components/schemas/exams.yaml#/ExamDocumentFile"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "404":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
