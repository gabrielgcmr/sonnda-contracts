# sonnda-contracts/openapi/paths/exams.yaml
collection:
  post:
    operationId: uploadExamDocument
    summary: Enviar documento de exame
    tags: [ExamDocuments]
    parameters:
      - $ref: "../components/parameters.yaml#/PatientId"
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              collection_date:
                type: string
                format: date
    responses:
      "201":
        description: Documento recebido e classificado
        content:
          application/json:
            schema:
              $ref: "../components/schemas/exams.yaml#/ExamDocument"
      "400":
        $ref: "../components/responses.yaml#/Problem"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "413":
        $ref: "../components/responses.yaml#/Problem"
      "415":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"

item:
  get:
    operationId: getExamDocument
    summary: Obter documento de exame
    tags: [ExamDocuments]
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Documento de exame
        content:
          application/json:
            schema:
              $ref: "../components/schemas/exams.yaml#/ExamDocument"
      "401":
        $ref: "../components/responses.yaml#/Problem"
      "403":
        $ref: "../components/responses.yaml#/Problem"
      "404":
        $ref: "../components/responses.yaml#/Problem"
      "500":
        $ref: "../components/responses.yaml#/Problem"
