# sonnda-contracts/.github/workflows/release.yml
name: Publish contract release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make validate-bundle
      - run: go test ./...
      - run: sha256sum dist/openapi.yaml > dist/openapi.yaml.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/openapi.yaml dist/openapi.yaml.sha256 --title "$GITHUB_REF_NAME" --generate-notes
